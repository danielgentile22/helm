<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helm 2 direction arena</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1a1a1a; --line: #d6d6d2; --accent: #1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #ececec; --line: #333; --accent: #ececec; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; gap: 6px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  nav strong { margin-right: auto; font-size: 14px; }
  nav button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  iframe { flex: 1; border: 0; width: 100%; }
  small { opacity: .7; width: 100%; font-size: 12px; }
</style>
</head>
<body>
<nav>
  <strong>Helm 2 direction arena</strong>
  <button data-c="opus">Opus</button>
  <button data-c="fable">Fable</button>
  <button data-c="sonnet">Sonnet</button>
  <small>Each candidate has its own light and dark toggle at the top of its page.</small>
</nav>
<iframe id="f" title="candidate"></iframe>
<script>
  const f = document.getElementById('f');
  const btns = [...document.querySelectorAll('nav button')];
  function show(c) {
    f.src = 'candidates/' + c + '.html';
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === c)));
    location.hash = c;
  }
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.c)));
  show(['opus','fable','sonnet'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'opus');
</script>
</body>
</html>
