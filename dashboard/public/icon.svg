<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>helm</title>
  <desc>The Observatory at a glance. Two structure rings, one resting circle and one open
  diamond out on the far ring, one arriving diamond in on the near ring. Distance from the
  centre is time until a thing lands, and near is larger and brighter as well as warmer, so
  the reading survives colour blindness. Every colour is a token from src/styles/tokens.css.</desc>

  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0b0d14"/>
      <stop offset="58%"  stop-color="#080a10"/>
      <stop offset="100%" stop-color="#06070b"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4d6" stop-opacity="0.50"/>
      <stop offset="38%"  stop-color="#ffb445" stop-opacity="0.26"/>
      <stop offset="70%"  stop-color="#ffb445" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffb445" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#fff4d6"/>
      <stop offset="46%"  stop-color="#ffb445"/>
      <stop offset="100%" stop-color="#e07a2e"/>
    </linearGradient>
    <clipPath id="plate"><rect width="512" height="512" rx="56" ry="56"/></clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="512" height="512" fill="#06070b"/>
    <circle cx="256" cy="256" r="236" fill="url(#disc)"/>

    <g fill="none" stroke="#232b3b" stroke-width="3">
      <circle cx="256" cy="256" r="96"/>
      <circle cx="256" cy="256" r="176"/>
    </g>

    <circle cx="101" cy="339" r="13" fill="#7fd4e8" opacity="0.72"/>
    <path d="M404 336 L420 352 L404 368 L388 352 Z" fill="none" stroke="#7fd4e8"
          stroke-width="5" opacity="0.62"/>

    <circle cx="307" cy="175" r="86" fill="url(#halo)"/>
    <path d="M307 129 L353 175 L307 221 L261 175 Z" fill="url(#face)"/>
  </g>
</svg>
